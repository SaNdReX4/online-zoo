<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Zoo - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reg-container">
        <form id="reg-form" class="auth-form" novalidate>
            <h1>Registration</h1>
            
            <div class="input-group">
                <label for="reg-name">Name</label>
                <input type="text" id="reg-name" placeholder="Enter your name">
                <span class="error-msg" id="name-error"></span>
            </div>

            <div class="input-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="Enter your email">
                <span class="error-msg" id="email-error"></span>
            </div>

            <div class="input-group">
                <label for="reg-login">Login</label>
                <input type="text" id="reg-login" placeholder="Choose a login">
                <span class="error-msg" id="login-error"></span>
            </div>

            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Create a password">
                <span class="error-msg" id="pass-error"></span>
            </div>

            <div class="input-group">
                <label for="reg-confirm">Confirm Password</label>
                <input type="password" id="reg-confirm" placeholder="Confirm your password">
                <span class="error-msg" id="confirm-error"></span>
            </div>

            <button type="submit" id="reg-btn" disabled>Register</button>
            
            <p class="switch-auth">Already have an account? <a href="../login/index.html">Sign In</a></p>
        </form>
    </div>

    <script src="../../dist/registration.js" type="module" ></script>
</body>
</html>
